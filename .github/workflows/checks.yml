# Fast checks on a free Linux runner: types, lint, unit tests, design tokens, Expo doctor.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Design tokens CSS is up to date
        run: npm run tokens:check
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor
