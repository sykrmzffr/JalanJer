# Builds the Android app on a free GitHub Linux runner and uploads .apk files
# you can install straight onto an Android phone. See docs/ANDROID_INSTALL.md.
#
#   debug   = development build (expo-dev-client). Loads JS from Metro on your PC.
#   release = JS bundled inside the app. Works on its own; use it to judge speed.
#
# Both are signed with Android's standard debug key, which is fine for testing
# on your own phone but not for the Play Store (that comes in Milestone 7).
name: Android build

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Android ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build .apk
        working-directory: android
        # Only 64-bit ARM (every Android phone from about 2017 on) to halve build time.
        run: |
          task=assemble$(echo "${{ matrix.variant }}" | sed 's/./\U&/')
          ./gradlew "$task" -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Name the .apk
        id: apk
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          src="android/app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk"
          name="JalanJer-Android-${{ matrix.variant }}-${sha::7}.apk"
          mv "$src" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
